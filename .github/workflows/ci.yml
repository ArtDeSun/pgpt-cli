name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Single branch policy
        run: |
          mapfile -t branches < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}')
          printf 'remote branches: %s\n' "${branches[*]}"
          test "${#branches[@]}" -eq 1
          test "${branches[0]}" = "main"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate
        run: |
          python -m json.tool config.json > /dev/null
          python -m json.tool evals/end_to_end_cases.json > /dev/null
          python -m json.tool evals/judge_calibration.json > /dev/null
          python -m json.tool evals/routing_gold.json > /dev/null
          python -m json.tool evals/routing_policy_cases.json > /dev/null
          python -m compileall -q pgpt tools tests

      - name: Browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path("web/index.html").read_text(encoding="utf-8")
          match = re.search(r"<script>([\s\S]*?)</script>", text)
          if match is None:
              raise SystemExit("inline browser script not found")
          Path("/tmp/pgpt-ui.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/pgpt-ui.js
          node --check web/persistence.js

      - name: Tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Pull-and-run smoke
        run: |
          pgpt --help > /dev/null
          pgpt status
          pgpt validate --web off "What is dependency injection?" > /tmp/pgpt-route.json
          python -m json.tool /tmp/pgpt-route.json > /dev/null

  report:
    if: ${{ always() && github.event_name == 'push' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish release gate status
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.test.result }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$RESULT" = "success" ]; then
            export STATE=success
            export DESCRIPTION="Python 3.11/3.13 release gate passed"
          else
            export STATE=failure
            export DESCRIPTION="Python 3.11/3.13 release gate failed"
          fi
          python - <<'PY' > /tmp/status.json
          import json
          import os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "ci/release-gate",
              "description": os.environ["DESCRIPTION"],
              "target_url": (
                  f"https://github.com/{os.environ['REPO']}/actions/runs/"
                  f"{os.environ['RUN_ID']}"
              ),
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            --data @/tmp/status.json
