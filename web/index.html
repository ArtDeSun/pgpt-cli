<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pgpt-cli</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#171717;--side:#141414;--panel:#232323;--panel2:#2c2c2c;--border:#383838;--muted:#a5a5a5;--text:#f2f2f2}
    *{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{height:100vh;display:grid;grid-template-columns:260px 1fr}aside{min-width:0;padding:12px;border-right:1px solid var(--border);background:var(--side);display:flex;flex-direction:column}.brand{padding:8px;font-weight:700}.side-actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin:8px 0}.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:9px;padding:9px 11px}.btn:hover{background:var(--panel2)}.btn.primary{background:#ededed;color:#151515;border-color:#ededed;font-weight:650}.icon-btn{width:36px;padding:0;display:grid;place-items:center}.search{width:100%;border:1px solid var(--border);background:#1b1b1b;color:var(--text);border-radius:9px;padding:9px;outline:none}.side-scroll{overflow:auto;margin-top:10px}.section-label{padding:10px 8px 4px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.chat-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;border-radius:8px;padding:3px 4px 3px 8px}.chat-row:hover,.chat-row.active{background:#272727}.chat-name,.tiny{border:0;background:transparent;color:#d8d8d8}.chat-name{text-align:left;padding:7px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tiny{padding:6px;color:var(--muted);border-radius:6px}.tiny:hover{background:#343434;color:white}.sidebar-footer{margin-top:auto;padding-top:10px;border-top:1px solid var(--border);color:var(--muted);font-size:11px;line-height:1.5}
    main{min-width:0;height:100vh;display:grid;grid-template-rows:auto 1fr auto;position:relative}header{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:rgba(23,23,23,.97)}header select{background:#222;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 8px}header label{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px}.spacer{flex:1}.usage{padding:6px 9px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:12px}.usage.warn{color:#ffd27d}.online{color:#8ed6a4}.offline{color:#e7aa82}
    #conversation{overflow:auto;padding:28px max(22px,calc((100% - 820px)/2)) 180px;scroll-behavior:smooth}.empty{max-width:700px;margin:15vh auto 0;text-align:center;color:var(--muted)}.empty h1{margin-bottom:8px;color:var(--text);font-size:28px}.message-wrap{margin-bottom:24px}.date-separator{text-align:center;color:#777;font-size:11px;margin:24px 0}.message{max-width:86%;padding:12px 15px;border-radius:16px;line-height:1.58;overflow-wrap:anywhere}.message.user{margin-left:auto;background:#303030}.message.assistant{max-width:100%;padding-left:0;padding-right:0}.message-time{margin-top:5px;color:#777;font-size:10px}.user+.message-time{text-align:right}.md h1,.md h2,.md h3{margin:1.2em 0 .5em;line-height:1.25}.md h1{font-size:1.45rem}.md h2{font-size:1.25rem}.md h3{font-size:1.08rem}.md p{margin:.65em 0}.md ul,.md ol{margin:.55em 0 .8em 1.4em;padding:0}.md li{margin:.22em 0}.md a{color:#9fc5ff;text-decoration:underline}.md code.inline{padding:1px 5px;border:1px solid #3b3b3b;border-radius:5px;background:#2b2b2b;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.code-block{position:relative;margin:13px 0}.code-block pre{margin:0;padding:14px;overflow:auto;border:1px solid #383838;border-radius:10px;background:#111}.code-block code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;white-space:pre}.copy-code{position:absolute;top:7px;right:7px;padding:5px 8px;border:1px solid #3c3c3c;border-radius:6px;background:#252525;color:#ddd;font-size:11px}blockquote{margin:.8em 0;padding-left:12px;border-left:3px solid #555;color:#ccc}.route{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;color:#858585;font-size:11px}.attachments,.suggestions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.attachment,.suggestion{border:1px solid #414141;background:#1e1e1e;color:#d7d7d7;border-radius:999px;padding:7px 10px;font-size:12px}.suggestion:hover{background:#2b2b2b}.thinking{display:inline-flex;align-items:center;gap:9px;color:#bdbdbd}.spinner{width:15px;height:15px;border:2px solid #555;border-top-color:#ddd;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .composer-shell{position:absolute;bottom:0;left:0;right:0;padding:38px 18px 16px;background:linear-gradient(transparent,var(--bg) 35%)}.composer{max-width:830px;margin:auto;border:1px solid #414141;border-radius:18px;background:#262626;box-shadow:0 8px 35px rgba(0,0,0,.28)}.attachment-bar{display:none;gap:6px;flex-wrap:wrap;padding:8px 10px 0}.attachment-bar.visible{display:flex}textarea{width:100%;min-height:52px;max-height:180px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:13px 14px 6px}.composer-actions{display:flex;align-items:center;gap:6px;padding:5px 8px 8px}.round{width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:#ccc;display:grid;place-items:center}.round:hover{background:#363636}.send{background:#eee;color:#111}.send:disabled{opacity:.45;cursor:wait}.status{max-width:830px;min-height:14px;margin:6px auto 0;padding-left:6px;color:#777;font-size:10px}
    .drawer{position:absolute;inset:0 0 0 auto;width:min(560px,92vw);z-index:20;display:none;grid-template-rows:auto 1fr;border-left:1px solid var(--border);background:#181818;box-shadow:-20px 0 50px rgba(0,0,0,.45)}.drawer.open{display:grid}.drawer-head{padding:13px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}.drawer-body{overflow:auto;padding:12px}.response-row{padding:10px;border:1px solid transparent;border-radius:9px;cursor:pointer}.response-row:hover{background:#242424;border-color:#333}.response-title{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.response-meta{margin-top:3px;color:#777;font-size:10px}.response-view{max-width:850px;margin:0 auto}.response-toolbar{display:flex;justify-content:space-between;gap:10px;margin-bottom:16px}
    @media(max-width:760px){.app{grid-template-columns:1fr}aside{position:absolute;left:0;top:0;bottom:0;width:270px;z-index:30;transform:translateX(-100%);transition:transform .2s}aside.open{transform:translateX(0)}#mobileMenu{display:inline-grid!important}header{padding-left:10px}#conversation{padding-left:14px;padding-right:14px}.message{max-width:94%}}
  </style>
</head>
<body>
<div class="app">
  <aside id="sidebar">
    <div class="brand">●&nbsp; pgpt-cli</div>
    <div class="side-actions"><button id="newChat" class="btn primary">New chat</button><button id="openResponses" class="btn icon-btn" title="Saved responses">▤</button></div>
    <input id="chatSearch" class="search" placeholder="Search chats" />
    <div id="chatList" class="side-scroll"></div>
    <div class="sidebar-footer">Chats and attachments stay in this browser's local storage.<br />Personal skills: ~/.config/pgpt/skills/</div>
  </aside>
  <main>
    <header>
      <button id="mobileMenu" class="btn icon-btn" style="display:none" title="Chats">☰</button>
      <label>Project <select id="project"></select></label>
      <label>Web <select id="web"><option value="auto">auto</option><option value="off">off · local-only</option><option value="lookup">lookup</option><option value="research">research</option></select></label>
      <label>Skill <select id="skill"><option value="">off</option></select></label>
      <label><input id="deep" type="checkbox" /> deep</label>
      <span class="spacer"></span><button id="exportChat" class="btn">Export chat</button><span id="usage" class="usage">Brave usage…</span>
    </header>
    <section id="conversation" aria-live="polite"></section>
    <div class="composer-shell">
      <div class="composer">
        <div id="attachmentBar" class="attachment-bar"></div>
        <textarea id="prompt" rows="2" placeholder="Message pgpt-cli…" autofocus></textarea>
        <div class="composer-actions"><input id="fileInput" type="file" multiple hidden accept=".txt,.md,.markdown,.py,.js,.jsx,.ts,.tsx,.json,.yaml,.yml,.csv,.html,.css,.sh,.toml,.ini,.log" /><button id="attach" class="round" title="Attach text/code files">＋</button><span class="spacer"></span><button id="send" class="round send" title="Send">↑</button></div>
      </div>
      <div id="status" class="status"></div>
    </div>
    <section id="responsesDrawer" class="drawer"><div class="drawer-head"><strong>Saved responses</strong><span class="spacer"></span><button id="refreshResponses" class="btn">Refresh</button><button id="closeResponses" class="btn icon-btn">×</button></div><div id="responsesBody" class="drawer-body"></div></section>
  </main>
</div>
<script>
(() => {
  const $ = selector => document.querySelector(selector);
  const conversation = $('#conversation');
  const promptBox = $('#prompt');
  const send = $('#send');
  const status = $('#status');
  const project = $('#project');
  const web = $('#web');
  const skill = $('#skill');
  const deep = $('#deep');
  const chatList = $('#chatList');
  const chatSearch = $('#chatSearch');
  const sidebar = $('#sidebar');
  const usage = $('#usage');
  const attachmentBar = $('#attachmentBar');
  const fileInput = $('#fileInput');
  const responsesDrawer = $('#responsesDrawer');
  const responsesBody = $('#responsesBody');
  const STORAGE_KEY = 'pgpt-cli-browser-state-v3';
  const LEGACY_KEYS = ['pgpt-cli-browser-state-v2', 'pgpt-cli-browser-chat-v1'];
  const MAX_CHATS = 100, MAX_MESSAGES = 200, MAX_FILE_BYTES = 250 * 1024, MAX_ATTACH_BYTES = 750 * 1024;
  let pendingAttachments = [], timerHandle = null, renderQueued = false;
  const uid = () => crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;

  function freshState() {
    const id = uid(), now = new Date().toISOString();
    return {activeId: id, chats: [{id, title: 'New chat', pinned: false, createdAt: now, updatedAt: now, messages: []}]};
  }

  function loadState() {
    for (const key of [STORAGE_KEY, ...LEGACY_KEYS]) {
      try {
        const value = JSON.parse(localStorage.getItem(key) || 'null');
        if (value?.chats?.length) return value;
        if (Array.isArray(value) && value.length) {
          const state = freshState();
          state.chats[0].title = 'Imported chat';
          state.chats[0].messages = value.map(message => ({...message, at: new Date().toISOString()}));
          return state;
        }
      } catch (_) {}
    }
    return freshState();
  }

  let state = loadState();
  function persist() {
    state.chats = state.chats.sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt)).slice(0, MAX_CHATS);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }
  function activeChat() {
    let chat = state.chats.find(item => item.id === state.activeId);
    if (!chat) {
      chat = freshState().chats[0];
      state.chats.unshift(chat); state.activeId = chat.id; persist();
    }
    return chat;
  }
  function escapeHtml(value) { return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'); }
  function inlineMarkdown(value) {
    let text = escapeHtml(value);
    text = text.replace(/`([^`\n]+)`/g, '<code class="inline">$1</code>');
    text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    text = text.replace(/(?<!["'=])(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
    return text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/__([^_]+)__/g, '<strong>$1</strong>').replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>');
  }
  function renderMarkdown(source) {
    const blocks = [];
    const text = String(source || '').replace(/```([^\n]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      const index = blocks.length; blocks.push({lang: String(lang || '').trim(), code: String(code || '').replace(/\n$/, '')}); return `\n@@CODEBLOCK_${index}@@\n`;
    });
    const out = []; let list = null;
    const close = () => { if (list) out.push(`</${list}>`); list = null; };
    for (const raw of text.split(/\r?\n/)) {
      const line = raw.trimEnd(), code = line.match(/^@@CODEBLOCK_(\d+)@@$/);
      if (code) { close(); const item = blocks[Number(code[1])]; out.push(`<div class="code-block"><button class="copy-code" data-code="${encodeURIComponent(item.code)}">Copy</button><pre><code data-language="${escapeHtml(item.lang)}">${escapeHtml(item.code)}</code></pre></div>`); continue; }
      const heading = line.match(/^(#{1,3})\s+(.+)$/);
      if (heading) { close(); const n = heading[1].length; out.push(`<h${n}>${inlineMarkdown(heading[2])}</h${n}>`); continue; }
      const unordered = line.match(/^\s*[-*]\s+(.+)$/);
      if (unordered) { if (list !== 'ul') { close(); list = 'ul'; out.push('<ul>'); } out.push(`<li>${inlineMarkdown(unordered[1])}</li>`); continue; }
      const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
      if (ordered) { if (list !== 'ol') { close(); list = 'ol'; out.push('<ol>'); } out.push(`<li>${inlineMarkdown(ordered[1])}</li>`); continue; }
      if (/^\s*>\s?/.test(line)) { close(); out.push(`<blockquote>${inlineMarkdown(line.replace(/^\s*>\s?/, ''))}</blockquote>`); continue; }
      if (!line.trim()) { close(); continue; }
      close(); out.push(`<p>${inlineMarkdown(line)}</p>`);
    }
    close(); return out.join('');
  }

  function extractSuggestions(text) {
    const match = String(text || '').match(/\n#{1,3}\s+(?:Next ideas|Next steps|Suggested follow-ups|Follow-up suggestions)\s*\n([\s\S]*)$/i);
    if (!match) return {body: text, suggestions: []};
    return {
      body: String(text).slice(0, match.index).trimEnd(),
      suggestions: match[1].split(/\r?\n/).map(line => line.replace(/^\s*(?:[-*]|\d+[.)])\s+/, '').trim()).filter(Boolean).slice(0, 4),
    };
  }
  const fallbackSuggestions = () => ['Explain the most important part in more detail.', 'Show me a practical example.', 'What should I do next?'];
  const formatTime = value => new Intl.DateTimeFormat([], {hour:'numeric', minute:'2-digit'}).format(new Date(value));
  const formatFullTime = value => new Intl.DateTimeFormat([], {year:'numeric', month:'short', day:'numeric', hour:'numeric', minute:'2-digit', second:'2-digit'}).format(new Date(value));
  const dateKey = value => new Date(value).toLocaleDateString();

  function renderAttachments(items = []) {
    return items.length ? `<div class="attachments">${items.map(file => `<button class="attachment" data-download-attachment="${escapeHtml(file.id)}">📎 ${escapeHtml(file.name)} · ${Math.round(file.size/1024)} KB</button>`).join('')}</div>` : '';
  }
  function queueConversationRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; renderConversation(); });
  }
  function renderConversation() {
    const chat = activeChat(); conversation.innerHTML = '';
    if (!chat.messages.length) {
      conversation.innerHTML = '<div class="empty"><h1>How can pgpt-cli help?</h1><p>Local-first chat with project source, optional Brave web search, skills, and Ollama.</p></div>'; return;
    }
    let previousDay = null;
    for (const message of chat.messages) {
      const at = message.at || chat.createdAt, day = dateKey(at);
      if (day !== previousDay) { const separator = document.createElement('div'); separator.className='date-separator'; separator.textContent=day; conversation.appendChild(separator); previousDay=day; }
      const wrap = document.createElement('article'); wrap.className='message-wrap';
      const bubble = document.createElement('div'); bubble.className=`message ${message.role}`;
      if (message.role === 'assistant') {
        const parsed = extractSuggestions(message.content);
        bubble.innerHTML = `<div class="md">${renderMarkdown(parsed.body)}</div>`;
        if (message.streaming && !message.content) bubble.innerHTML = '<div class="thinking"><span class="spinner"></span><span>Working…</span></div>';
        const route = message.meta?.route, timing = message.meta?.timing;
        if (route || timing) { const meta = document.createElement('div'); meta.className='route'; const parts=[]; if(route?.execution)parts.push(route.execution); if(route?.model)parts.push(route.model); if(timing?.total_seconds!=null)parts.push(`${Number(timing.total_seconds).toFixed(1)}s`); meta.textContent=parts.join(' · '); bubble.appendChild(meta); }
        if (!message.streaming) { const suggestions = parsed.suggestions.length ? parsed.suggestions : fallbackSuggestions(); const node=document.createElement('div'); node.className='suggestions'; node.innerHTML=suggestions.map(text => `<button class="suggestion" data-suggestion="${encodeURIComponent(text)}">${escapeHtml(text)}</button>`).join(''); bubble.appendChild(node); }
      } else bubble.textContent = message.content;
      if (message.attachments?.length) bubble.insertAdjacentHTML('beforeend', renderAttachments(message.attachments));
      const time = document.createElement('div'); time.className='message-time'; time.textContent=formatTime(at); time.title=formatFullTime(at);
      wrap.appendChild(bubble); wrap.appendChild(time); conversation.appendChild(wrap);
    }
    conversation.scrollTop = conversation.scrollHeight;
  }

  function renderChatList() {
    const query = chatSearch.value.trim().toLowerCase();
    const chats = [...state.chats].filter(chat => !query || chat.title.toLowerCase().includes(query)).sort((a,b) => Number(b.pinned)-Number(a.pinned) || new Date(b.updatedAt)-new Date(a.updatedAt));
    const rows = items => items.map(chat => `<div class="chat-row ${chat.id===state.activeId?'active':''}"><button class="chat-name" data-open-chat="${chat.id}" title="${escapeHtml(chat.title)}">${escapeHtml(chat.title)}</button><button class="tiny" data-pin-chat="${chat.id}" title="${chat.pinned?'Unpin':'Pin'}">${chat.pinned?'★':'☆'}</button><button class="tiny" data-delete-chat="${chat.id}" title="Delete">×</button></div>`).join('');
    const pinned = chats.filter(chat => chat.pinned), recent = chats.filter(chat => !chat.pinned);
    chatList.innerHTML = (pinned.length ? `<div class="section-label">Pinned</div>${rows(pinned)}` : '') + `<div class="section-label">Recents</div>${rows(recent) || '<div class="response-meta" style="padding:8px">No matching chats</div>'}`;
  }
  function createChat() { const chat=freshState().chats[0]; state.chats.unshift(chat); state.activeId=chat.id; pendingAttachments=[]; renderAttachmentBar(); persist(); renderChatList(); renderConversation(); promptBox.focus(); }
  function removeChat(id) { const chat=state.chats.find(item=>item.id===id); if(!chat || !confirm(`Delete "${chat.title}"?`))return; state.chats=state.chats.filter(item=>item.id!==id); if(!state.chats.length)state=freshState(); else if(state.activeId===id)state.activeId=state.chats[0].id; persist(); renderChatList(); renderConversation(); }
  const titleFromPrompt = text => { const compact=text.replace(/\s+/g,' ').trim(); return compact.length>46 ? `${compact.slice(0,46)}…` : compact || 'New chat'; };
  function renderAttachmentBar() { attachmentBar.classList.toggle('visible', pendingAttachments.length>0); attachmentBar.innerHTML=pendingAttachments.map(file=>`<button class="attachment" data-remove-attachment="${file.id}">📎 ${escapeHtml(file.name)} · ×</button>`).join(''); }
  async function addFiles(list) { let total=pendingAttachments.reduce((sum,file)=>sum+file.size,0); for(const file of [...list]) { if(file.size>MAX_FILE_BYTES){status.textContent=`${file.name} is larger than ${MAX_FILE_BYTES/1024} KB.`;continue} if(total+file.size>MAX_ATTACH_BYTES){status.textContent='Attachment total is too large.';break} try{const content=await file.text();pendingAttachments.push({id:uid(),name:file.name,type:file.type||'text/plain',size:file.size,content});total+=file.size}catch(_){status.textContent=`Could not read ${file.name} as text.`} } renderAttachmentBar(); fileInput.value=''; }
  function apiMessages(chat) { return chat.messages.filter(message=>!message.streaming).map(message => { if(message.role!=='user'||!message.attachments?.length)return{role:message.role,content:message.content}; const files=message.attachments.map(file=>`\n\n--- Attached file: ${file.name} ---\n${file.content}\n--- End attached file: ${file.name} ---`).join(''); return{role:'user',content:message.content+files}; }); }

  function startLoading() { const started=performance.now(),wrap=document.createElement('article'); wrap.id='loadingMessage'; wrap.className='message-wrap'; wrap.innerHTML='<div class="message assistant"><div class="thinking"><span class="spinner"></span><span id="loadingLabel">Starting</span><strong id="loadingTimer">0.0s</strong></div></div>'; conversation.appendChild(wrap); conversation.scrollTop=conversation.scrollHeight; timerHandle=setInterval(()=>{const node=$('#loadingTimer');if(node)node.textContent=`${((performance.now()-started)/1000).toFixed(1)}s`},100); }
  function updateLoading(label, elapsed) { const node=$('#loadingLabel'),timer=$('#loadingTimer'); if(node)node.textContent=label; if(timer && elapsed!=null)timer.textContent=`${Number(elapsed).toFixed(1)}s`; status.textContent=label; }
  function stopLoading() { clearInterval(timerHandle); timerHandle=null; $('#loadingMessage')?.remove(); }

  async function refreshUsage() { try{const response=await fetch('/api/web-usage'),data=await response.json(),used=data.effective_requests??data.local_requests??0,budget=data.budget||'∞';usage.textContent=`Brave ${used}/${budget} · ${data.online?'online':'offline'}`;usage.classList.toggle('warn',Boolean(data.warning));usage.classList.toggle('online',Boolean(data.online)&&!data.warning);usage.classList.toggle('offline',!data.online)}catch(_){usage.textContent='Brave usage unavailable'} }
  async function loadMeta() { const response=await fetch('/api/meta'),meta=await response.json(); project.innerHTML=''; for(const name of meta.projects||[]){const option=document.createElement('option');option.value=name;option.textContent=name;option.selected=name===meta.default_project;project.appendChild(option)} skill.innerHTML='<option value="">off</option>'; for(const name of meta.skills||[]){const option=document.createElement('option');option.value=name;option.textContent=name;skill.appendChild(option)} }

  function consumeSseBlock(block, assistant) {
    const line = block.split(/\r?\n/).find(value => value.startsWith('data: '));
    if (!line) return false;
    const raw = line.slice(6); if (raw === '[DONE]') return true;
    const data = JSON.parse(raw), event = data.pgpt?.event;
    if (event === 'status') updateLoading(data.pgpt.label, data.pgpt.elapsed);
    if (event === 'replace') { assistant.content=data.pgpt.content||''; queueConversationRender(); }
    if (event === 'error') throw new Error(data.pgpt.error?.message || 'Request failed');
    if (event === 'done') { assistant.meta={route:data.pgpt.route,timing:data.pgpt.timing,responsePath:data.pgpt.response_path}; status.textContent=data.pgpt.response_path?`Saved response: ${data.pgpt.response_path}`:''; }
    const content = data.choices?.[0]?.delta?.content;
    if (content) { if (assistant.streaming && !assistant.content) stopLoading(); assistant.content += content; queueConversationRender(); }
    return false;
  }

  async function submit() {
    const text=promptBox.value.trim(); if((!text&&!pendingAttachments.length)||send.disabled)return;
    const chat=activeChat(),now=new Date().toISOString(),attachments=pendingAttachments.map(file=>({...file}));
    if(chat.title==='New chat')chat.title=titleFromPrompt(text||attachments[0]?.name);
    chat.messages.push({role:'user',content:text||`Attached ${attachments.length} file${attachments.length===1?'':'s'}.`,attachments,at:now});
    chat.messages=chat.messages.slice(-MAX_MESSAGES); chat.updatedAt=now;
    const requestMessages=apiMessages(chat);
    const assistant={role:'assistant',content:'',at:new Date().toISOString(),streaming:true}; chat.messages.push(assistant);
    pendingAttachments=[]; renderAttachmentBar(); promptBox.value=''; persist(); renderChatList(); renderConversation(); send.disabled=true; status.textContent='Starting…'; startLoading();
    try {
      const response=await fetch('/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'pgpt-cli',stream:true,messages:requestMessages,pgpt:{project:project.value||undefined,web:web.value,deep:deep.checked||undefined,skill:skill.value||undefined}})});
      if(!response.ok){let message='Request failed';try{message=(await response.json())?.error?.message||message}catch(_){}throw new Error(message)}
      if(!response.body)throw new Error('Streaming response body is unavailable');
      const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='',done=false;
      while(!done){const part=await reader.read();done=part.done;buffer+=decoder.decode(part.value||new Uint8Array(),{stream:!done});const blocks=buffer.split(/\r?\n\r?\n/);buffer=blocks.pop()||'';for(const block of blocks){if(consumeSseBlock(block,assistant)){done=true;break}}}
      if(buffer.trim())consumeSseBlock(buffer,assistant);
    } catch(error) {
      assistant.content=`Request failed: ${error.message}`; status.textContent='';
    } finally {
      stopLoading(); assistant.streaming=false; chat.updatedAt=new Date().toISOString(); persist(); send.disabled=false; renderChatList(); renderConversation(); refreshUsage(); promptBox.focus();
    }
  }

  function downloadBlob(name,content,type='text/plain'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
  function exportCurrentChat(){const chat=activeChat(),lines=[`# ${chat.title}`,''];for(const message of chat.messages){lines.push(`## ${message.role==='user'?'You':'Assistant'}`,'',message.content,'');if(message.attachments?.length)lines.push(`Attachments: ${message.attachments.map(file=>file.name).join(', ')}`,'')}downloadBlob(`${chat.title.replace(/[^\w.-]+/g,'-').slice(0,60)||'chat'}.md`,lines.join('\n'),'text/markdown')}
  async function loadResponses(){responsesBody.innerHTML='<div class="response-meta">Loading…</div>';try{const response=await fetch('/api/responses'),data=await response.json(),rows=data.responses||[];responsesBody.innerHTML=rows.length?rows.map(item=>`<div class="response-row" data-response-name="${encodeURIComponent(item.name)}"><div class="response-title">${escapeHtml(item.name)}</div><div class="response-meta">${escapeHtml(new Date(item.modified).toLocaleString())} · ${Math.round(item.size/1024)} KB</div></div>`).join(''):'<div class="response-meta">No saved responses yet.</div>'}catch(error){responsesBody.innerHTML=`<div class="response-meta">Could not load responses: ${escapeHtml(error.message)}</div>`}}
  async function openResponse(name){responsesBody.innerHTML='<div class="response-meta">Loading response…</div>';const response=await fetch(`/api/responses/${encodeURIComponent(name)}`),data=await response.json();if(!response.ok)throw new Error(data.error||'Response not found');responsesBody.innerHTML=`<div class="response-view"><div class="response-toolbar"><button class="btn" id="backResponses">← Responses</button><a class="btn" href="/api/responses/${encodeURIComponent(name)}/download">Download Markdown</a></div><div class="md">${renderMarkdown(data.content)}</div></div>`;$('#backResponses').addEventListener('click',loadResponses)}

  document.addEventListener('click', event => {
    const target=event.target.closest('button,[data-response-name]'); if(!target)return;
    if(target.dataset.openChat){state.activeId=target.dataset.openChat;persist();renderChatList();renderConversation();sidebar.classList.remove('open')}
    else if(target.dataset.pinChat){const chat=state.chats.find(item=>item.id===target.dataset.pinChat);if(chat){chat.pinned=!chat.pinned;chat.updatedAt=new Date().toISOString();persist();renderChatList()}}
    else if(target.dataset.deleteChat)removeChat(target.dataset.deleteChat);
    else if(target.dataset.suggestion){promptBox.value=decodeURIComponent(target.dataset.suggestion);promptBox.focus()}
    else if(target.dataset.removeAttachment){pendingAttachments=pendingAttachments.filter(file=>file.id!==target.dataset.removeAttachment);renderAttachmentBar()}
    else if(target.dataset.downloadAttachment){const file=activeChat().messages.flatMap(message=>message.attachments||[]).find(item=>item.id===target.dataset.downloadAttachment);if(file)downloadBlob(file.name,file.content,file.type)}
    else if(target.classList.contains('copy-code')){navigator.clipboard.writeText(decodeURIComponent(target.dataset.code||''));target.textContent='Copied';setTimeout(()=>target.textContent='Copy',1000)}
    else if(target.dataset.responseName)openResponse(decodeURIComponent(target.dataset.responseName)).catch(error=>responsesBody.innerHTML=`<div class="response-meta">${escapeHtml(error.message)}</div>`);
  });

  $('#newChat').addEventListener('click',createChat); $('#openResponses').addEventListener('click',()=>{responsesDrawer.classList.add('open');loadResponses()}); $('#closeResponses').addEventListener('click',()=>responsesDrawer.classList.remove('open')); $('#refreshResponses').addEventListener('click',loadResponses); $('#exportChat').addEventListener('click',exportCurrentChat); $('#attach').addEventListener('click',()=>fileInput.click()); fileInput.addEventListener('change',()=>addFiles(fileInput.files)); chatSearch.addEventListener('input',renderChatList); $('#mobileMenu').addEventListener('click',()=>sidebar.classList.toggle('open')); send.addEventListener('click',submit); promptBox.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submit()}}); promptBox.addEventListener('input',()=>{promptBox.style.height='auto';promptBox.style.height=`${Math.min(promptBox.scrollHeight,180)}px`});
  const responseName=new URLSearchParams(location.search).get('response'); if(responseName){responsesDrawer.classList.add('open');openResponse(responseName).catch(loadResponses)}
  persist(); renderChatList(); renderConversation(); renderAttachmentBar(); loadMeta().catch(error=>status.textContent=`Metadata error: ${error.message}`); refreshUsage();
})();
</script>
</body>
