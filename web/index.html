<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pgpt-cli</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #101214; color: #eceff1; }
    main { width: min(1000px, 100%); margin: 0 auto; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
    header { position: sticky; top: 0; z-index: 5; padding: 14px 18px; background: rgba(16,18,20,.94); border-bottom: 1px solid #2b3035; backdrop-filter: blur(10px); }
    .top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    h1 { margin: 0 12px 0 0; font-size: 18px; }
    label { display: flex; gap: 6px; align-items: center; font-size: 12px; color: #aeb7bf; }
    select, input, textarea, button { font: inherit; }
    select { background: #1c2024; color: #e7ebee; border: 1px solid #343a40; border-radius: 8px; padding: 7px 9px; }
    #chat { padding: 24px 18px 150px; }
    .message { max-width: 82%; margin: 0 0 18px; padding: 12px 14px; border-radius: 14px; white-space: pre-wrap; line-height: 1.5; overflow-wrap: anywhere; }
    .user { margin-left: auto; background: #28313a; }
    .assistant { background: #191d21; border: 1px solid #2d3339; }
    .meta { margin-top: 8px; color: #89939d; font-size: 11px; white-space: normal; }
    footer { position: fixed; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, #101214 28%); padding: 36px 16px 16px; }
    .composer { width: min(964px, 100%); margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 10px; background: #1a1e22; border: 1px solid #353b41; border-radius: 16px; padding: 10px; }
    textarea { resize: none; min-height: 52px; max-height: 180px; background: transparent; color: #f4f6f7; border: 0; outline: 0; padding: 8px; }
    button { align-self: end; border: 0; border-radius: 10px; padding: 10px 16px; background: #e8edf0; color: #101214; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .45; cursor: wait; }
    .status { padding: 6px 2px 0; color: #909aa3; font-size: 11px; }
    @media (max-width: 640px) { .message { max-width: 94%; } header { position: static; } }
  </style>
</head>
<body>
<main>
  <header>
    <div class="top">
      <h1>pgpt-cli</h1>
      <label>Project <select id="project"></select></label>
      <label>Web
        <select id="web">
          <option value="auto">auto</option>
          <option value="off">off</option>
          <option value="lookup">lookup</option>
          <option value="research">research</option>
        </select>
      </label>
      <label>Skill <select id="skill"><option value="">off</option></select></label>
      <label><input id="deep" type="checkbox" /> deep</label>
      <button id="newChat" type="button">New chat</button>
    </div>
  </header>
  <section id="chat" aria-live="polite"></section>
</main>
<footer>
  <div class="composer">
    <textarea id="prompt" rows="2" placeholder="Message pgpt-cli…" autofocus></textarea>
    <button id="send">Send</button>
  </div>
  <div class="status" id="status"></div>
</footer>
<script>
  const chat = document.querySelector('#chat');
  const promptBox = document.querySelector('#prompt');
  const send = document.querySelector('#send');
  const status = document.querySelector('#status');
  const project = document.querySelector('#project');
  const web = document.querySelector('#web');
  const skill = document.querySelector('#skill');
  const deep = document.querySelector('#deep');
  const newChat = document.querySelector('#newChat');
  const storageKey = 'pgpt-cli-browser-chat-v1';
  let messages = [];

  try {
    const stored = JSON.parse(localStorage.getItem(storageKey) || '[]');
    if (Array.isArray(stored)) messages = stored.slice(-100);
  } catch (_) {
    messages = [];
  }

  function saveMessages() {
    localStorage.setItem(storageKey, JSON.stringify(messages.slice(-100)));
  }

  function addMessage(role, text, route) {
    const node = document.createElement('article');
    node.className = `message ${role}`;
    node.textContent = text;
    if (route) {
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = `route: ${route.execution} · template: ${route.template} · model: ${route.model}`;
      node.appendChild(meta);
    }
    chat.appendChild(node);
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  async function loadMeta() {
    const response = await fetch('/api/meta');
    const meta = await response.json();
    project.innerHTML = '';
    for (const name of meta.projects || []) {
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      option.selected = name === meta.default_project;
      project.appendChild(option);
    }
    for (const name of meta.skills || []) {
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      skill.appendChild(option);
    }
  }

  async function submit() {
    const text = promptBox.value.trim();
    if (!text || send.disabled) return;
    promptBox.value = '';
    addMessage('user', text);
    messages.push({ role: 'user', content: text });
    saveMessages();
    send.disabled = true;
    status.textContent = 'Running local pipeline…';

    try {
      const response = await fetch('/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'pgpt-cli',
          messages,
          pgpt: {
            project: project.value || undefined,
            web: web.value,
            deep: deep.checked || undefined,
            skill: skill.value || undefined,
          },
        }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data?.error?.message || 'Request failed');
      const textOut = data.choices?.[0]?.message?.content || '';
      messages.push({ role: 'assistant', content: textOut });
      saveMessages();
      addMessage('assistant', textOut, data.pgpt?.route);
      status.textContent = data.pgpt?.response_path ? `saved: ${data.pgpt.response_path}` : '';
    } catch (error) {
      addMessage('assistant', `Error: ${error.message}`);
      status.textContent = '';
    } finally {
      send.disabled = false;
      promptBox.focus();
    }
  }

  for (const message of messages) {
    addMessage(message.role, message.content);
  }

  newChat.addEventListener('click', () => {
    messages = [];
    saveMessages();
    chat.innerHTML = '';
    status.textContent = '';
    promptBox.focus();
  });

  send.addEventListener('click', submit);
  promptBox.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      submit();
    }
  });

  loadMeta().catch((error) => { status.textContent = `Metadata error: ${error.message}`; });
</script>
</body>
</html>
